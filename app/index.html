<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Eifel Fire Radar</title>
  <meta name="description" content="NISAR radar shows what changed in the Hürtgenwald forest around the August 2026 fire. A NASA Space Apps Challenge 2026 project, Dancing with the SARs.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="lib/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- ============================================================ top bar -->
  <header class="top">
    <div class="brand">
      <h1>Eifel Fire Radar</h1>
      <p class="sub">NASA Space Apps 2026 · Dancing with the SARs</p>
    </div>
    <nav class="seg" id="regions" aria-label="Region" hidden></nav>
    <nav class="seg" aria-label="Mode">
      <button type="button" id="mode-explore" aria-pressed="true">Explore</button>
      <button type="button" id="mode-learn" aria-pressed="false">Learn</button>
    </nav>
    <button type="button" class="link" id="open-about">About</button>
  </header>

  <main class="stage" id="stage">
    <div id="map" aria-label="Map of the study area"></div>

    <!-- ============================================================ left card: layers (Explore) or steps (Learn) -->
    <aside class="card panel" id="panel">
      <button type="button" class="panel-head" id="panel-toggle" aria-expanded="true" aria-controls="panel-body">
        <span class="panel-title" id="panel-title">Layers</span>
        <span class="panel-mini" id="panel-mini"></span>
        <svg class="chev" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="panel-body" id="panel-body">
        <div id="layers" role="radiogroup" aria-label="Map layer"><!-- filled by app.js --></div>

        <section id="learn" hidden>
          <article id="learn-step" class="learn-step" aria-live="polite"></article>
          <div class="learn-nav">
            <button type="button" class="btn" id="learn-prev">Back</button>
            <div class="dots" id="learn-dots" aria-hidden="true"></div>
            <button type="button" class="btn btn-primary" id="learn-next">Next</button>
          </div>
        </section>
      </div>
    </aside>

    <!-- ============================================================ compare: one button, one date -->
    <div class="compare" id="compare">
      <button type="button" class="pill" id="cmp-btn" aria-pressed="false">Compare</button>
      <label class="pill pill-select" id="cmp-with" hidden>
        <span>with</span>
        <select id="cmp-date" aria-label="Date to compare with"></select>
      </label>
    </div>

    <!-- compare line on the map -->
    <div class="swipe" id="swipe" hidden>
      <div class="swipe-line"></div>
      <span class="swipe-tag swipe-tag-l" id="swipe-l"></span>
      <span class="swipe-tag swipe-tag-r" id="swipe-r"></span>
      <button type="button" class="swipe-handle" id="swipe-handle"
              role="slider" aria-label="Compare line: left the earlier date, right the later date"
              aria-valuemin="0" aria-valuemax="100" aria-valuenow="50">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path d="M9 6 L3 12 L9 18 M15 6 L21 12 L15 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>

    <!-- ============================================================ time -->
    <footer class="card time">
      <div class="time-now">
        <strong id="now-date"></strong>
        <span id="now-note"></span>
      </div>
      <div class="timeline" id="timeline">
        <div class="tl-line"></div>
        <div class="tl-fire" id="tl-fire"><span id="tl-fire-label"></span></div>
        <div class="tl-stops" id="tl-stops"></div>
        <div class="tl-ref" id="tl-ref" hidden></div>
        <div class="tl-handle" id="tl-handle" role="slider" tabindex="0" aria-label="Date shown" aria-valuemin="0"></div>
      </div>
    </footer>
  </main>

  <!-- ============================================================ about -->
  <dialog id="about" aria-labelledby="about-title">
    <div class="dialog-head">
      <h2 id="about-title">About this map</h2>
      <button type="button" class="btn" id="close-about">Close</button>
    </div>
    <div class="dialog-body" id="about-body"><!-- filled by app.js from the metadata --></div>
  </dialog>

  <div id="load-error" class="load-error" hidden></div>

  <script src="lib/leaflet.js"></script>
  <!-- Data is loaded with <script> tags (works from file://). app.js tries these folders in order. -->
  <script>
    /* The study areas. Each one is a folder made by gcov_change.py series (plus the optional
     * make_stable.py / make_damage.py extras). A region whose folder is missing is simply not offered.
     * "about" and "fireSource" are shown in the About dialog; keep them honest and sourced. */
    window.REGIONS = [
      {
        id: "eifel",
        name: "Hürtgenwald",
        title: "Hürtgenwald · Eifel, Germany — NISAR track 144",
        dirs: ["layers_series_all", "layers_series"],
        perimeter: "data/perimeter.geojson",
        about: "In August 2026 a forest fire burned in the Hürtgenwald near Aachen.",
        fireSource: '<span class="placeholder">[PLACEHOLDER: official source for the fire dates]</span>',
      },
      {
        id: "ardennes",
        name: "Monthermé",
        title: "Monthermé · Ardennes, France — NISAR track 66",
        dirs: ["layers_series_fr"],
        about: 'In the same hot August week, on 15 August 2026, a forest fire burned about 95 ha of steep,' +
          ' hard-to-reach forest at Monthermé in the French Ardennes, the wooded border country between' +
          ' France and Belgium. The prefecture declared it contained on 16 August and fixed on 17 August' +
          ' (<a href="https://www.franceinfo.fr/faits-divers/incendie/le-feu-de-foret-dans-les-ardennes-est-desormais-circonscrit-selon-la-prefecture_8150165.html">franceinfo</a>,' +
          ' <a href="https://www.lavenir.net/actu/monde/2026/08/18/feux-de-foret-pres-de-la-frontiere-franco-belge-lincendie-dans-une-foret-des-ardennes-desormais-fixe-XH2JJ5G2TJD7FGA7PIXPW5IEEI/">L\u2019Avenir</a>).',
        fireSource: 'Préfecture des Ardennes, via <a href="https://www.franceinfo.fr/faits-divers/incendie/le-feu-de-foret-dans-les-ardennes-est-desormais-circonscrit-selon-la-prefecture_8150165.html">franceinfo (16 Aug 2026)</a> and <a href="https://www.matele.be/incendie-a-montherme-france-100-hectares-sont-deja-partis-en-fumee">Matélé (17 Aug 2026)</a>',
      },
      {
        id: "gironde",
        name: "Gironde",
        title: "Saumos · Gironde, France — NISAR track 95",
        dirs: ["layers_series_gironde"],
        about: 'On 22 July 2026 a fire broke out at Saumos in the Gironde, west of Bordeaux, and spread west into' +
          ' the pine forests towards Lacanau and Le Porge. It was declared fixed on 1 August, with flare-ups' +
          ' afterwards (Lacanau, 8 August). According to the French forest service ONF it burned about 42,000 ha,' +
          ' 39,000 ha of them forest (<a href="https://www.onf.fr/vivre-la-foret/enjeux-foret/feux-foret/+/2dae::incendies-en-gironde-et-dans-les-landes-les-forestiers-de-lonf-au-coeur-de-la-crise.html">ONF</a>,' +
          ' <a href="https://feuxdeforet.fr/en/gironde-33/saumos-22-07-2026-4367/">Feux de Forêt</a>).',
        fireSource: '<a href="https://feuxdeforet.fr/en/gironde-33/saumos-22-07-2026-4367/">Feux de Forêt</a> (start 22 Jul, fixed 1 Aug 2026) and <a href="https://www.onf.fr/vivre-la-foret/enjeux-foret/feux-foret/+/2dae::incendies-en-gironde-et-dans-les-landes-les-forestiers-de-lonf-au-coeur-de-la-crise.html">ONF</a> (area)',
      },
    ];
  </script>
  <script src="app.js"></script>
</body>
</html>
